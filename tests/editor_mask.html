<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; font-family: sans-serif; }
  #wrapper { position: absolute; left: 10px; top: 320px; width: 300px; }
  #editor { border: 1px solid #333; min-height: 40px; }
  #tapado { position: absolute; left: 10px; top: 10px; width: 200px; height: 60px;
            border: 1px solid #666; }
  #otro { position: absolute; left: 400px; top: 10px; width: 200px; height: 40px;
          border: 1px solid #666; }
  [data-testid='mask'] { position: fixed; left: 0; top: 0; width: 300px;
                         height: 300px; background: rgba(255,0,0,0.15);
                         z-index: 9999; }
</style></head>
<body>
  <div id="tapado" role="textbox" contenteditable="true"></div>
  <div id="otro" role="textbox" contenteditable="true">contenido</div>
  <div id="wrapper"><div id="editor" contenteditable="true">VIEJO</div></div>
  <div data-testid="mask"></div>
</body></html>
