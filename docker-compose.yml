version: '3.8'

services:
  # Todo en uno, igual que en Railway (supervisord): xvfb + dashboard web
  # (Streamlit) + scheduler + bot interno de Telegram (@enigmawebi_bot,
  # TELEGRAM_BOT_TOKEN) + bot de clientes (@vrf2fa_bot,
  # TELEGRAM_CLIENTES_BOT_TOKEN), todos en el MISMO contenedor.
  # Los dos tokens deben ser DISTINTOS entre sí.
  app:
    build: .
    container_name: gestor-redes-dashboard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    ports:
      - "8501:8501"
    environment:
      - TZ=America/Mexico_City
      - PORT=8501
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# NOTA: no existe (ni debe crearse) un servicio aparte para los bots de
# Telegram. El servicio `app` los arranca dentro de supervisord
# ([program:bot] y [program:bot-clientes]); un segundo proceso con el mismo
# token produciría un conflicto de polling (`Conflict: terminated by other
# getUpdates request`) y tumbaría ambos bots.
