version: '3.8'

services:
  # Dashboard web (Streamlit) + scheduler, igual que en Railway (supervisord).
  # Sin bot de Telegram: la interfaz es el dashboard web.
  app:
    build: .
    container_name: gestor-redes-dashboard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    ports:
      - "8501:8501"
    environment:
      - TZ=America/Mexico_City
      - PORT=8501
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Bot de Telegram para CLIENTES no técnicos (código de verificación de X,
  # cambiar nombre, foto de perfil y portada con botones).
  # Token propio: TELEGRAM_CLIENTES_BOT_TOKEN en .env (crear el bot con
  # @BotFather). Es independiente del bot interno.
  bot-clientes:
    build: .
    container_name: gestor-redes-bot-clientes
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: python -m bot_clientes.main
    environment:
      - TZ=America/Mexico_City
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
