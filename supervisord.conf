[supervisord]
nodaemon=true
user=root
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3

; Pantalla virtual (Xvfb). Railway no tiene display: sin esto, Chrome visible
; no arranca y Selenium falla al publicar/activar. Arranca antes que el resto.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
directory=/app
autostart=true
autorestart=true
startsecs=2
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Dashboard web (Streamlit). Puerto FIJO 8501: en Railway el "Target port" del
; dominio publico DEBE ser 8501 (si no, el Edge devuelve 502 "Application
; failed to respond"). No usar $PORT: si la plataforma inyecta otro valor
; (p. ej. 8080) el edge y la app quedarian desalineados.
[program:dashboard]
command=python -m streamlit run web/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler de tareas programadas (24/7).
[program:scheduler]
command=python -m scheduler.standalone
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Bot INTERNO de Telegram (@enigmawebi_bot): menú de administración para el
; equipo. Necesita TELEGRAM_BOT_TOKEN real en el .env; sin él el proceso sale
; con código 1 (startsecs/startretries limitan los reintentos para no entrar
; en un loop infinito mientras falte el token).
[program:bot]
command=python -m bot.main
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=15
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Bot de CLIENTES (@vrf2fa_bot): código de verificación de X, cambiar nombre,
; foto de perfil y portada con botones. Token PROPIO en
; TELEGRAM_CLIENTES_BOT_TOKEN (NUNCA el mismo que el bot interno: Telegram solo
; admite un getUpdates por token). Sin token sale con código 1.
[program:bot-clientes]
command=python -m bot_clientes.main
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=15
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; VNC OPCIONAL (opt-in) para el MODO ASISTIDO de Change.org en Railway:
; expone la pantalla virtual :99 para resolver el captcha desde el navegador.
; Sin VNC_ACTIVO=1 (o sin VNC_PASSWORD) vnc.sh sale con 0 y no arranca nada.
; startsecs=0: el wrapper puede salir con 0 al estar desactivado sin que
; supervisord lo tome como fallo de arranque (evita reintentos/FATAL en logs).
[program:vnc-x11vnc]
command=/app/vnc.sh x11vnc
directory=/app
priority=2
autostart=true
autorestart=unexpected
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Puente noVNC (websockify) para ver :99 desde el navegador en Railway.
; Opt-in igual que vnc-x11vnc; requiere VNC_PASSWORD y que x11vnc este vivo.
[program:vnc-novnc]
command=/app/vnc.sh novnc
directory=/app
priority=3
autostart=true
autorestart=unexpected
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
