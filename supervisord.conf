[supervisord]
nodaemon=true
user=root
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3

; Pantalla virtual (Xvfb). Railway no tiene display: sin esto, Chrome visible
; no arranca y Selenium falla al publicar/activar. Arranca antes que el resto.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
directory=/app
autostart=true
autorestart=true
startsecs=2
priority=1
stdout_logfile=/app/data/logs/xvfb.out.log
stderr_logfile=/app/data/logs/xvfb.err.log

; Dashboard web (Streamlit). Usa $PORT (lo inyecta Railway; por defecto 8501 en Dockerfile).
[program:dashboard]
command=python -m streamlit run web/app.py --server.port=%(ENV_PORT)s --server.address=0.0.0.0 --server.headless=true
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/logs/dashboard.out.log
stderr_logfile=/app/data/logs/dashboard.err.log

; Scheduler de tareas programadas (24/7).
[program:scheduler]
command=python -m scheduler.standalone
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/app/data/logs/scheduler.out.log
stderr_logfile=/app/data/logs/scheduler.err.log
